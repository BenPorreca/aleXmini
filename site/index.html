<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>aleX mini</title>
<link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 57C9 41 4 27 11 17c6-8 18-6 21 3 4-10 16-11 22-2 6 10 0 24-22 39z' fill='%23ff9bb3' stroke='%233b3b4f' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel=stylesheet>
<style>
:root{--ink:#3b3b4f;--bg:#fff8e8;--pink:#ffb3c1;--sun:#ffe38a;--sky:#cdeefc;--mint:#c9f1dc}
*{box-sizing:border-box}
body{margin:0;padding:14px 14px 40px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:var(--bg) radial-gradient(#f2e2bd 2px,transparent 2px) 0 0/28px 28px;color:var(--ink);font:clamp(20px,1.1vw + 16px,26px)/1.15 Gaegu,"Comic Sans MS",cursive;text-align:center}
h1{margin:4px 0 0;font-size:clamp(38px,5vw,58px);display:flex;justify-content:center;align-items:center;gap:8px;transform:rotate(-1.5deg)}
h1 img{width:1.05em;height:1.05em}
.sub{margin:0 0 6px;opacity:.75}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:var(--g);margin:10px auto;user-select:none;-webkit-user-select:none}
.c{aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:10px 14px 9px 13px/13px 9px 14px 10px;position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--g)*.09);font-weight:700;cursor:pointer}
.c.b{background:var(--ink);cursor:default}.c.w{background:var(--sky)}.c.s{background:var(--sun)}.c.x{background:#ffd0d0}
.n{position:absolute;top:1px;left:5px;font-size:max(11px,calc(var(--g)*.034));font-style:normal;font-weight:400}
#clue{width:min(92vw,520px);margin:8px auto;padding:8px 12px;background:var(--mint);border:3px solid var(--ink);border-radius:14px 10px 15px 9px/10px 15px 9px 14px;min-height:44px}
button{font:inherit;color:inherit;background:var(--pink);border:3px solid var(--ink);border-radius:12px 9px 13px 8px/9px 13px 8px 12px;padding:2px 16px;min-height:44px;margin:4px;cursor:pointer}
button:hover{background:var(--sun)}
.lists{display:flex;gap:18px;max-width:min(92vw,720px);margin:14px auto;text-align:left;flex-wrap:wrap;justify-content:center}
.lists div{flex:1 1 240px}.lists h3{margin:0 0 4px;border-bottom:3px dotted var(--ink)}
li{list-style:none;padding:2px 6px;border-radius:8px;cursor:pointer}li.a{background:var(--sun)}
ul{margin:0;padding:0}#kb{font-size:16px;position:absolute;opacity:0;pointer-events:none;left:-99px}
#win{font-size:30px;margin:8px;min-height:36px}
#ov{position:fixed;inset:0;background:rgba(59,59,79,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#ov[hidden]{display:none}
#md{background:var(--bg);border:3px solid var(--ink);border-radius:14px 10px 15px 9px/10px 15px 9px 14px;padding:16px 18px;max-width:360px;width:100%}
#md h2{margin:0 0 6px;font-size:34px}#md p{margin:4px 0}#mbtn{margin-top:8px}
#sh{width:100%;font:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px;resize:none}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}#bg div{position:absolute;opacity:.85}#bg img{width:100%;display:block}
@media(max-width:760px){#bg .w{display:none}}
/* responsive: phone portrait (default) -> tablet portrait -> wide/landscape two-column */
:root{--g:min(92vw,400px)}
#play{display:flex;flex-direction:column;align-items:center;max-width:1100px;margin:0 auto}
#left{display:flex;flex-direction:column;align-items:center;flex:none}
@media(min-width:600px) and (orientation:portrait){:root{--g:min(76vw,600px)}}
@media(min-width:760px) and (orientation:landscape),(min-width:1000px){
:root{--g:min(44vw,76vh,540px)}
#play{flex-direction:row;align-items:flex-start;justify-content:center;gap:40px}
.lists{flex:0 1 460px;margin:10px 0}.lists div{flex:1 1 190px}}
#win:empty{display:none}
.lists{width:100%}
</style></head><body>
<div id=bg></div>
<h1>aleX mini <img src="images/logo.png" alt=""></h1>
<p class=sub><span id=date></span> · <span id=t>0:00</span></p>
<div id=play><div id=left>
<div id=grid></div><div id=clue>Loading today's puzzle…</div><div id=win></div>
<div><button onclick=check()>Check</button><button onclick=askReveal()>Reveal</button><button onclick=askClear()>Clear</button></div>
</div><div class=lists><div><h3>Across</h3><ul id=A></ul></div><div><h3>Down</h3><ul id=D></ul></div></div></div>
<div id=ov hidden onclick="if(event.target==this)this.hidden=true"><div id=md><h2 id=mt></h2><div id=mb></div><div id=mbtn></div></div></div>
<input id=kb autocomplete=off autocapitalize=characters>
<script>
// doodle decorations: [shape, left%, top%, width px, tilt deg, wide-screens-only]
[['heart',2,2,72,-14,0],['star',90,7,64,13,0],['sparkle',88,84,60,-9,0],['sparkle',3,46,56,11,1],['star',6,82,62,-12,1],['heart',92,46,68,9,1]].forEach(([n,x,y,w,r,wd])=>{
document.getElementById('bg').insertAdjacentHTML('beforeend',`<div class="${wd?'w':''}" style="left:${x}%;top:${y}%;width:clamp(${w*.8}px,${w/10}vw,${w*1.5}px);transform:rotate(${r}deg)"><picture><source media="(prefers-reduced-motion: reduce)" srcset="images/${n}_still.png"><img src="images/${n}.gif" alt=""></picture></div>`)});
const $=id=>document.getElementById(id);let P,G={},N={},M={},sel,dir='A',bad=new Set(),t0=Date.now(),done=0;
const D=new URLSearchParams(location.search).get('d')||new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
fetch('puzzles.json').then(r=>r.json()).then(j=>{const p=j.puzzles[D];if(!p)throw 0;init({...p,date:D})}).catch(()=>$('clue').textContent="Today's puzzle isn't ready yet. Check back soon!");
function init(p){P=p;$('clue').style.display='none';$('grid').style.gridTemplateColumns=`repeat(${p.pattern.length},1fr)`;$('date').textContent=new Date(p.date+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
p.entries.forEach(e=>{e.cells=[...Array(e.len)].map((_,i)=>(e.r+(e.dir=='D'?i:0))+','+(e.c+(e.dir=='A'?i:0)));N[e.r+','+e.c]=e.num;e.cells.forEach(k=>(M[k]=M[k]||{})[e.dir]=e)});
['A','D'].forEach(d=>$(d).innerHTML=p.entries.filter(e=>e.dir==d).map(e=>`<li id=l${e.id} onclick="go('${e.id}')"><b>${e.num}</b> ${e.clue.replace(/</g,'&lt;')}</li>`).join(''));
const f=p.entries[0];sel=f.cells[0];dir=f.dir;draw();setInterval(()=>{if(!done){let s=Math.floor((Date.now()-t0)/1e3);$('t').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},1e3)}
function ent(){const m=M[sel];if(!m[dir])dir=dir=='A'?'D':'A';return m[dir]}
function draw(){const a=ent();$('grid').innerHTML=P.pattern.map((row,r)=>[...row].map((ch,c)=>{if(ch=='#')return'<div class="c b"></div>';const k=r+','+c;
return`<div class="c${a.cells.includes(k)?' w':''}${sel==k?' s':''}${bad.has(k)?' x':''}" onclick="pick('${k}')">${N[k]?`<i class=n>${N[k]}</i>`:''}${G[k]||''}</div>`}).join('')).join('');
document.querySelectorAll('li').forEach(l=>l.classList.toggle('a',l.id=='l'+a.id))}
function pick(k){if(sel==k){const m=M[k],o=dir=='A'?'D':'A';if(m[o])dir=o}else sel=k;draw();$('kb').value=' ';$('kb').focus()}
function go(id){const e=P.entries.find(x=>x.id==id);sel=e.cells[0];dir=e.dir;draw();$('kb').focus()}
function step(n){const c=ent().cells,i=c.indexOf(sel)+n;if(i>=0&&i<c.length)sel=c[i]}
function type(ch){G[sel]=ch;bad.clear();step(1);draw();finish()}
function back(){if(G[sel])delete G[sel];else{step(-1);delete G[sel]}bad.clear();draw()}
function arrow(dr,dc){let[r,c]=sel.split(',').map(Number);do{r+=dr;c+=dc}while(P.pattern[r]&&P.pattern[r][c]=='#');if(P.pattern[r]&&P.pattern[r][c]){sel=r+','+c;dir=dr?'D':'A';draw()}}
$('kb').addEventListener('input',e=>{if(!P||!$('ov').hidden)return;const v=e.target.value;e.target.value=' ';if(!v)back();else{const ch=v.slice(-1).toUpperCase();if(/[A-Z]/.test(ch))type(ch)}});
document.addEventListener('keydown',e=>{if(!P||!$('ov').hidden||e.metaKey||e.ctrlKey)return;const m={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[e.key];
if(m){e.preventDefault();arrow(...m)}else if(e.key=='Backspace'){e.preventDefault();back()}else if(e.key==' '||e.key=='Tab'){e.preventDefault();pick(sel)}
else if(/^[a-z]$/i.test(e.key)){e.preventDefault();type(e.key.toUpperCase())}});
function check(){bad=new Set(Object.keys(G).filter(k=>G[k]!=ans(k)));draw();finish()}
function ans(k){const e=Object.values(M[k])[0];return e.answer[e.cells.indexOf(k)]}
let result='';
function modal(t,b,btns){$('mt').textContent=t;$('mb').innerHTML=b;const m=$('mbtn');m.innerHTML='';btns.forEach(([l,f])=>{const x=document.createElement('button');x.textContent=l;x.onclick=()=>{if(f&&f(x)===false)return;$('ov').hidden=true};m.appendChild(x)});$('ov').hidden=false}
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('ov').hidden=true});
function finish(){if(done||!P)return;if(Object.keys(M).every(k=>G[k]==ans(k))){done=1;const s=Math.floor((Date.now()-t0)/1e3);result=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('t').textContent=result;$('win').innerHTML='<button onclick=showWin()>♥ View results</button>';showWin()}}
function showWin(){const msg=`aleX mini ♥ ${$('date').textContent}\nSolved in ${result}\n${location.origin+location.pathname}`;
modal('Congrats! ♥',`<p>You solved today's mini in</p><p style="font-size:46px;font-weight:700;margin:0 0 8px">${result}</p><textarea id=sh readonly rows=3>${msg}</textarea>`,[['Copy message',x=>{try{const t=$('sh');t.select();navigator.clipboard?navigator.clipboard.writeText(t.value):document.execCommand('copy');x.textContent='Copied!'}catch(e){}return false}],['Close']])}
function askReveal(){modal('Reveal the answers?','<p>This fills in every square and stops your timer.</p>',[['Yes, reveal',reveal],['Keep playing']])}
function askClear(){modal('Clear the board?','<p>This erases everything you have entered.</p>',[['Yes, clear',clr],['Keep playing']])}
function reveal(){done=1;Object.keys(M).forEach(k=>G[k]=ans(k));bad.clear();draw()}
function clr(){G={};bad.clear();draw()}
</script></body></html>
